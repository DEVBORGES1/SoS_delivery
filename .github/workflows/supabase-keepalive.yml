# Grava no banco uma vez por dia para o projeto grátis do Supabase não ser
# pausado por inatividade (a pausa acontece após 7 dias sem uso).
#
# Configure em Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_URL       ex.: https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  chave "anon public" (ou "publishable") do projeto
#
# Para testar na hora: aba Actions → "Supabase keep-alive" → Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 * * *' # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chama a função keepalive do banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Ping enviado com sucesso."
